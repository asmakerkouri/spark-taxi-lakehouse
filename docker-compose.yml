# Standalone Spark cluster (1 master + 2 workers) and a driver that runs the pipeline on it.
# docker compose up --build   ->  Spark UI: http://localhost:8080
x-spark-image: &spark
  image: bitnami/spark:3.5
  volumes:
    - lake:/data/lake

services:
  spark-master:
    <<: *spark
    environment:
      SPARK_MODE: master
    ports: ["8080:8080", "7077:7077"]

  spark-worker-1: &worker
    <<: *spark
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    depends_on: [spark-master]

  spark-worker-2: *worker

  driver:
    build: .
    environment:
      SPARK_MASTER: spark://spark-master:7077
      DRIVER_MEMORY: 2g
    volumes:
      - lake:/data/lake
    depends_on: [spark-worker-1, spark-worker-2]

volumes:
  lake:
